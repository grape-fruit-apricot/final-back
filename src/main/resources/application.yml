spring:
  application:
    name: midpoint
  profiles:
    # 순서가 중요하다. Spring 은 뒤에 오는 프로파일이 이긴다(last-wins).
    # constant 를 먼저 두면, gitignore 되는 application-local.yml 에서
    # 공통 상수를 덮어쓸 수 있다. 개발자는 자기 로컬 값을, 서버는 환경별 값을
    # local 쪽에만 적으면 되고 커밋되는 constant 파일은 건드리지 않는다.
    include:
    - constant
    - local
