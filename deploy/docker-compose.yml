# 서버 /opt/midpoint/docker-compose.yml 에 두는 파일의 참고용 사본.
#
# 이 파일은 프론트(final-front)의 산출물도 함께 참조하므로 어느 한쪽 레포가 소유하지 않는다.
# 서버에 배치하고 수동으로 관리한다. 배포 워크플로는 이 파일을 서버로 전송하지 않는다.
#
# 커스텀 이미지를 만들지 않는다. stock 이미지에 jar 와 dist 를 볼륨으로 넣는다.
# 그래서 Dockerfile 도, 레지스트리도, 로그인도 없다.
#
# 앞단은 Caddy 가 맡는다(TLS 종료 + 도메인별 분기 + /grafana 경로 분기).
# Caddy 는 같은 Docker 네트워크에서 서비스 이름과 컨테이너 내부 포트로 연결한다.
# main-web 은 호스트 포트를 공개하지 않고, 외부 80/443 은 Caddy 가 사용한다.
# API 의 호스트 포트 8080/8082 는 기존 배포 헬스 체크에서 사용한다.
# Caddy 설정은 ./caddy/Caddyfile 에 둔다.

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  main-web:
    image: nginx
    volumes:
      - ./main/dist:/usr/share/nginx/html:ro
      - ./main/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped
    mem_limit: 64m

  main-api:
    image: eclipse-temurin:21-jre
    ports:
      - "8080:8080"
    volumes:
      - ./main/app.jar:/app.jar:ro
      - ./main/config:/config:ro
      - ./main/logs:/logs
    environment:
      # LOCATION 이 아니라 ADDITIONAL_LOCATION 을 사용한다.
      # jar 안의 application.yml 등 기본 설정을 유지하면서 외부 설정을 추가한다.
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    command: java -jar /app.jar
    restart: unless-stopped
    mem_limit: 1200m

  develop-web:
    image: nginx
    ports:
      - "8081:80"
    volumes:
      - ./develop/dist:/usr/share/nginx/html:ro
      - ./develop/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped
    mem_limit: 64m

  develop-api:
    image: eclipse-temurin:21-jre
    ports:
      - "8082:8080"
    volumes:
      - ./develop/app.jar:/app.jar:ro
      - ./develop/config:/config:ro
      - ./develop/logs:/logs
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    command: java -jar /app.jar
    restart: unless-stopped
    mem_limit: 900m

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.1.2
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Seoul
      GF_SERVER_ROOT_URL: https://www.midpoint.my/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_PROTOCOL: http
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    secrets:
      - grafana_admin_password
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:

secrets:
  grafana_admin_password:
    file: ./monitoring/secrets/grafana_admin_password
